name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Android APKs
        working-directory: android
        run: ./gradlew assembleClientDebug assembleAdminDebug --no-daemon --stacktrace

      - name: Prepare Release APKs
        run: |
          cp android/app/build/outputs/apk/client/debug/app-client-debug.apk ApexInnovators.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk ApexAdmin.apk

      - name: Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexInnovators-Android-APK
          path: ApexInnovators.apk
          if-no-files-found: error

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexAdmin-Android-APK
          path: ApexAdmin.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: Apex Innovators Android Apps v1.0.2
          make_latest: true
          body: |
            ### Apex Innovators Android Applications

            1. **ApexInnovators.apk** — Public application for users and students to explore projects, hackathons, and community.
            2. **ApexAdmin.apk** — Admin & Core Team application with direct management, content moderation, and dashboard access for Shivam Yadav, Aryan Gupta, and Lipsarani Bisoyi.
          files: |
            ApexInnovators.apk
            ApexAdmin.apk
