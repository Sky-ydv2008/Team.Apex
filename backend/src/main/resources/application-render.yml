# Render profile — Postgres via the linked Render DB when available,
# otherwise embedded H2 so the app always boots (accounts are seeded either
# way; see SmokeDataSeeder). Schema is managed by JPA (ddl-auto=update);
# MySQL remains the canonical production schema in database/schema.sql.
spring:
  datasource:
    # JDBC_DATABASE_URL is set by the container entrypoint from Render's
    # DATABASE_URL (postgres://… -> jdbc:postgresql://…). Without it, fall
    # back to in-memory H2 so the service comes up no matter what.
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:apex;DB_CLOSE_DELAY=-1}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:/app/frontend/

app:
  jwt:
    secret: ${JWT_SECRET:render-demo-secret-change-me-0123456789abcdef0123456789abcdef}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
