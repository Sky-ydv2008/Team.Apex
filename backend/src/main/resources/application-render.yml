# Render (production demo) profile — Postgres via linked Render DB, schema from JPA
# (ddl-auto=update keeps the free demo self-maintaining; MySQL remains the
# canonical production schema in database/schema.sql), demo content seeded on
# first boot, and the static frontend served from the image (single origin).
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:apex_innovators}?sslmode=require
    username: ${PGUSER:apex}
    password: ${PGPASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:/app/frontend/

app:
  jwt:
    secret: ${JWT_SECRET:render-demo-secret-change-me-0123456789abcdef0123456789abcdef}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
