# Smoke profile — in-memory H2 in MySQL compatibility mode.
# Lets you boot and exercise the full API without a MySQL server:
#   mvn spring-boot:run -Dspring-boot.run.profiles=smoke
# (schema is generated from JPA entities; see SmokeDataSeeder for demo rows)
spring:
  datasource:
    url: jdbc:h2:mem:apex;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Fixed secret for local smoke runs only; production must set JWT_SECRET.
    secret: ${JWT_SECRET:apex-smoke-secret-0123456789abcdef-0123456789abcdef}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  cors:
    allowed-origins:
      - http://localhost:5500
      - http://127.0.0.1:5500
      - http://localhost:8080
