# Render blueprint — one-click deploy of the Apex Innovators platform.
# Apply: render.com → New+ → Blueprint → connect this GitHub repo → Apply.
# Produces: free web service (frontend + Spring Boot API, single origin) and a
# free Postgres database. First boot seeds demo content (see SmokeDataSeeder).
databases:
  - name: apex-innovators-db
    plan: free
    databaseName: apex_innovators
    user: apex

services:
  - type: web
    name: apex-innovators
    runtime: docker
    repo: https://github.com/Sky-ydv2008/Team.Apex
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/public/stats
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apex-innovators-db
          property: connectionString
