<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — Apex Innovators Admin</title>
  <meta name="description" content="Manage Apex Innovators users: search accounts, view profiles, update roles and status.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2322d3ee'/%3E%3Cpath d='M13 2 3 14h9l-1 8 10-12h-9l1-8z' fill='%23050a14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="admin-body">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="main-content">
        <div class="admin-stack">
          <div class="toolbar">
            <div class="toolbar-left filter-row">
              <div class="search-wrap">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="input" id="filter-q" type="search" placeholder="Search by name or email…" aria-label="Search users">
              </div>
            </div>
            <div class="toolbar-right">
              <span class="badge b-member">Roles: ADMIN · CORE_MEMBER · MEMBER</span>
            </div>
          </div>

          <p class="results-meta" id="list-info" role="status"></p>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">User</th>
                    <th scope="col">Role</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="hide-md">ID</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>
          <div id="table-pager"></div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="user-view-modal" class="modal" aria-labelledby="user-view-title">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="user-view-title">User profile</h2>
        <button class="modal-close" type="button" data-dialog-close aria-label="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="user-view-body"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" type="button" data-dialog-close>Close</button>
      </div>
    </div>
  </dialog>

  <dialog id="user-edit-modal" class="modal" aria-labelledby="user-edit-title">
    <div class="modal-box" style="max-width:480px;">
      <div class="modal-head">
        <h2 id="user-edit-title">Edit user</h2>
        <button class="modal-close" type="button" data-dialog-close aria-label="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="user-edit-form" class="modal-body form" novalidate>
        <input type="hidden" id="u-id" value="">
        <p class="muted" id="u-name-label" style="font-size:0.95rem;font-weight:600;color:var(--text);"></p>
        <div class="form-grid">
          <div class="field">
            <label for="u-role">Role</label>
            <select class="input" id="u-role">
              <option value="ADMIN">Admin</option>
              <option value="CORE_MEMBER">Core member</option>
              <option value="MEMBER">Member</option>
            </select>
          </div>
          <div class="field">
            <label for="u-status">Status</label>
            <select class="input" id="u-status">
              <option value="ACTIVE">Active</option>
              <option value="SUSPENDED">Suspended</option>
            </select>
          </div>
        </div>
        <p class="hint" style="font-size:0.8rem;color:var(--text-3);">Suspending a user blocks their access while keeping their content in the audit trail.</p>
        <div class="modal-foot" style="padding-inline:0;border-top:none;padding-bottom:0;">
          <span class="spacer"></span>
          <button class="btn btn-ghost" type="button" data-dialog-close>Cancel</button>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="../js/components.js"></script>
  <script type="module" src="../js/admin/admin-users.js"></script>
</body>
</html>
