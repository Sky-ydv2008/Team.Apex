<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Apex Innovators</title>
  <meta name="description" content="Log in to your Apex Innovators account to post in the community and manage your team activity.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Log in — Apex Innovators">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2322d3ee'/%3E%3Cpath d='M13 2 3 14h9l-1 8 10-12h-9l1-8z' fill='%23050a14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/human.css">
</head>
<body id="top">
  <header id="nav-root" data-active="login"></header>

  <main id="main-content">
    <section class="section">
      <div class="container container-tight">
        <div class="card card-pad" style="padding:clamp(1.5rem,4vw,2.25rem);">
          <div style="text-align:center;margin-bottom:1.5rem;">
            <span class="eyebrow center-rule" style="justify-content:center;">Welcome back</span>
            <h1 style="font-size:1.7rem;">Log in to Apex Innovators</h1>
            <p class="muted" style="font-size:0.94rem;margin-top:0.4rem;">Post in the community, follow reviews and manage your builds.</p>
          </div>

          <div id="login-alert" style="margin-bottom:1.1rem;"></div>

          <form id="login-form" class="form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input class="input" id="email" name="email" type="email" maxlength="190" placeholder="you@example.com" required autocomplete="email" autofocus>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input class="input" id="password" name="password" type="password" maxlength="128" placeholder="Your password" required autocomplete="current-password">
            </div>
            <div class="form-actions">
              <button class="btn btn-primary btn-lg btn-block" type="submit">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign in
              </button>
            </div>
          </form>

          <p class="center muted" style="font-size:0.9rem;margin-top:1.4rem;">
            New to the platform? <a href="register.html">Create an account</a>
          </p>
        </div>

        <p class="center faint" style="font-size:0.82rem;margin-top:1.25rem;">
          Trouble signing in? <a href="contact.html">Contact the team</a>.
        </p>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>

  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
